[shell]
font_family = "SF Pro Display"  # Noctalia default: Inter

[osd]
position = "top_right"  # top_right | top_left | top_center | bottom_right | bottom_left | bottom_center
background_opacity = 0.85

[bar.default]
position = "bottom"
start  = ["launcher"]
center = ["taskbar"]
end    = ["tray", "volume", "battery", "input-volume", "control-center", "clock"]
thickness = 48
scale = 1.0         # scales icons and text inside the bar
margin_edge = 0          # 0: flush against the screen edge
margin_ends = 0          # 0: full length, no inset
concave_edge_corners = true   # optional, default: true
radius = 0              # 0: square corners
background_opacity = 0.85
background_color = "#202020" # same as Windows 11

[widget.taskbar]
show_all_outputs = true        # optional: windows from all monitors
group_by_workspace = false     # optional: group icons by workspace
pinned = ["firefox", "code", "kitty"]
pinned_opacity = 0.5     # dimming for pinned apps that aren't running
show_running = true      # false = pinned-only strip
icon_scale = 2.0

[widget.input-volume]
type = "volume"
# device = "input"

[widget.clock]
format = "{:%H:%M}\n{:%Y-%d-%m}"
font_scale = 1.2
