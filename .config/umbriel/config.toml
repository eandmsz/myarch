[general]
autostart = ["noctalia"]
show_cheatsheet = false

[include]
files = ["outputs.generated.toml"] # We detect new displays and save it in this toml config so we remembrer how it was set

[input.mouse]
accel_profile = "flat"   # or "adaptive", or "custom 0.2 0.0 0.5 1.0 2.0"
sensitivity = 0.0        # -1.0 to 1.0

[input.touchpad]
accel_profile = "adaptive"   # adaptive is based on a reverse engineered Apple touch pad profile
sensitivity = 0.0        # -1.0 to 1.0

[input.keyboard]
layout = "us"
options = "grp:alt_shift_toggle"
repeat_rate = 40     # repeats/sec
repeat_delay = 300   # ms

[appearance]
prefer_no_csd = true
border_width = 1
corner_radius = 0   # 0 disables

[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 5
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[appearance.shadow]
enabled = true
softness = 10
offset_x = 2
offset_y = 2

[appearance.tab_bar]
font = "sans 10"

[appearance.title_bar]
mode = "negotiated"                 # "off" | "negotiated" | "on" | "forced"
height = 32
font = "sans 10"
button_position = "right"       # or "left"
buttons = ["minimize", "maximize", "close"]
button_glyph = "always"          # "always" | "hover" | "never"
button_background = true
button_corner_radius = 0       # -1 follows corner_radius; 0 = square; high = circles
button_size = 32
button_gap = 0
button_margin = 0
# we need a button width in the future when it will be supported

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd)$"
blur = true
blur_ignore_alpha = 0.6         # don't apply blur on highly transparent surfaces (below this level)
blur_optimized = false          # optimized blur would just pre-calculate wallpaper blur instead of showing the actual window under

[colors.title_bar]
background = "#292933CC"        # add alpha to let blur show through
close = "#FF6B6BFF"
maximize = "#7AA3FFFF"
minimize = "#FFD166FF"
close_glyph = "#141419FF"       # also *_glyph_hover for each button

[layout]
mode = "stacking"   # "scrolling" | "dwindle" | "master"
gap = 0

[keybinds]
"Super" = "spawn:noctalia msg panel-toggle launcher"
"Alt+L" = "spawn:noctalia msg lock"
"Alt+Tab" = "spawn:noctalia msg window-switcher"
"Alt+F4" = "window-close"
"Alt+S" = "spawn:noctalia msg settings-toggle"
"Alt+Shift" = "keyboard-layout-next"
"XF86AudioRaiseVolume" = "spawn:noctalia msg volume-up"
"XF86AudioLowerVolume" = "spawn:noctalia msg volume-down"
"XF86AudioMute" = "spawn:noctalia msg volume-mute"
"XF86MonBrightnessUp" = "spawn:noctalia msg brightness-up"
"XF86MonBrightnessDown" = "spawn:noctalia msg brightness-down"
"XF86KbdBrightnessUp" = "spawn:brightnessctl -d '*kbd_backlight' set +1"
"XF86KbdBrightnessDown" = "spawn:brightnessctl -d '*kbd_backlight' set 1-"
